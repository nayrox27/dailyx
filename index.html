<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">

  <title>DailyX - দৈনিক কাজ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: linear-gradient(160deg, #eff6ff, #f8fafc, #e0f2fe);
      color: #0f172a;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.25);
    }

    .brand h1 {
      font-size: 23px;
    }

    .brand p {
      font-size: 12px;
      color: #64748b;
      margin-top: 3px;
    }

    .notification-btn {
      width: 45px;
      height: 45px;
      border: none;
      background: white;
      border-radius: 15px;
      font-size: 20px;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
      cursor: pointer;
    }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, #1d4ed8, #2563eb, #0ea5e9);
      color: white;
      border-radius: 26px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 15px 35px rgba(37, 99, 235, 0.25);
    }

    .hero small {
      opacity: 0.85;
      font-size: 13px;
    }

    .hero h2 {
      font-size: 27px;
      margin: 8px 0;
    }

    .hero p {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.5;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 7px;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 85px;
      resize: none;
      margin-bottom: 14px;
    }

    textarea:focus,
    input:focus {
      border-color: #60a5fa;
      background: white;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .primary-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 15px;
      border-radius: 15px;
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    /* Tasks */
    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eef2f7;
    }

    .task:last-child {
      border-bottom: none;
    }

    .task-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-info strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .task-info span {
      color: #64748b;
      font-size: 12px;
    }

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 18px 5px;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      padding: 5px 0 20px;
    }

    @media (max-width: 360px) {
      .app {
        padding: 13px;
      }

      .hero h2 {
        font-size: 23px;
      }

      .input-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Header -->
  <div class="header">

    <div class="brand">
      <div class="logo">DX</div>

      <div>
        <h1>DailyX</h1>
        <p>আপনার প্রতিদিনের কাজের সঙ্গী</p>
      </div>
    </div>

    <button class="notification-btn" onclick="enableNotification()">
      🔔
    </button>

  </div>


  <!-- Hero -->
  <div class="hero">

    <small id="todayDate"></small>

    <h2>আজকের কাজ গুছিয়ে নিন</h2>

    <p>
      গুরুত্বপূর্ণ কাজ ভুলে যাবেন না।
      সময়মতো রিমাইন্ডার নিয়ে আপনার দিনকে আরও সহজ করুন।
    </p>

  </div>


  <!-- Add Task -->
  <div class="card">

    <div class="card-title">
      ➕ নতুন কাজ যোগ করুন
    </div>

    <label>কাজের নাম</label>

    <textarea
      id="taskName"
      placeholder="যেমন: বিদ্যুৎ বিল দিতে হবে">
    </textarea>


    <div class="input-row">

      <div>
        <label>তারিখ</label>
        <input type="date" id="taskDate">
      </div>

      <div>
        <label>সময়</label>
        <input type="time" id="taskTime">
      </div>

    </div>


    <button class="primary-btn" onclick="addTask()">
      🔔 রিমাইন্ডার সেট করুন
    </button>

  </div>


  <!-- Task List -->
  <div class="card">

    <div class="card-title">
      📋 আমার কাজ
    </div>

    <div id="taskList"></div>

  </div>


  <div class="footer">
    DailyX • আপনার সময়, আপনার কাজ
  </div>

</div>


<script>

  /* Today's Date */

  function showToday() {

    const now = new Date();

    const days = [
      "রবিবার",
      "সোমবার",
      "মঙ্গলবার",
      "বুধবার",
      "বৃহস্পতিবার",
      "শুক্রবার",
      "শনিবার"
    ];

    const months = [
      "জানুয়ারি",
      "ফেব্রুয়ারি",
      "মার্চ",
      "এপ্রিল",
      "মে",
      "জুন",
      "জুলাই",
      "আগস্ট",
      "সেপ্টেম্বর",
      "অক্টোবর",
      "নভেম্বর",
      "ডিসেম্বর"
    ];

    document.getElementById("todayDate").textContent =
      days[now.getDay()] +
      ", " +
      now.getDate() +
      " " +
      months[now.getMonth()] +
      " " +
      now.getFullYear();

  }

  showToday();


  /* Default Date & Time */

  const now = new Date();

  document.getElementById("taskDate").value =
    now.toISOString().split("T")[0];

  document.getElementById("taskTime").value =
    String(now.getHours()).padStart(2, "0") +
    ":" +
    String(now.getMinutes()).padStart(2, "0");


  /* Local Storage */

  let tasks =
    JSON.parse(localStorage.getItem("dailyxTasks")) || [];


  /* Add Task */

  function addTask() {

    const name =
      document.getElementById("taskName").value.trim();

    const date =
      document.getElementById("taskDate").value;

    const time =
      document.getElementById("taskTime").value;


    if (!name) {

      alert("দয়া করে কাজের নাম লিখুন।");
      return;

    }


    if (!date || !time) {

      alert("তারিখ এবং সময় নির্বাচন করুন।");
      return;

    }


    const task = {

      id: Date.now(),

      name: name,

      date: date,

      time: time

    };


    tasks.push(task);

    localStorage.setItem(
      "dailyxTasks",
      JSON.stringify(tasks)
    );


    document.getElementById("taskName").value = "";

    renderTasks();

    alert("✅ রিমাইন্ডার সেট হয়েছে!");

  }


  /* Show Tasks */

  function renderTasks() {

    const list =
      document.getElementById("taskList");


    if (tasks.length === 0) {

      list.innerHTML =
        '<div class="empty">এখনও কোনো কাজ যোগ করা হয়নি।</div>';

      return;

    }


    tasks.sort(function(a, b) {

      return (a.date + a.time)
        .localeCompare(b.date + b.time);

    });


    list.innerHTML = "";


    tasks.forEach(function(task) {

      const div =
        document.createElement("div");

      div.className = "task";


      div.innerHTML = `

        <div class="task-icon">
          ⏰
        </div>

        <div class="task-info">

          <strong>
            ${escapeHTML(task.name)}
          </strong>

          <span>
            📅 ${task.date}
            &nbsp; • &nbsp;
            ⏰ ${task.time}
          </span>

        </div>

        <button
          class="delete-btn"
          onclick="deleteTask(${task.id})">

          মুছুন

        </button>

      `;


      list.appendChild(div);

    });

  }


  /* Delete Task */

  function deleteTask(id) {

    if (!confirm("এই কাজটি মুছে ফেলবেন?")) {
      return;
    }


    tasks =
      tasks.filter(function(task) {

        return task.id !== id;

      });


    localStorage.setItem(
      "dailyxTasks",
      JSON.stringify(tasks)
    );


    renderTasks();

  }


  /* Security */

  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* Notification Permission */

  async function enableNotification() {

    if (!("Notification" in window)) {

      alert(
        "এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।"
      );

      return;

    }


    const permission =
      await Notification.requestPermission();


    if (permission === "granted") {

      new Notification("DailyX", {

        body:
          "নোটিফিকেশন সফলভাবে চালু হয়েছে! 🔔"

      });

    }

    else {

      alert(
        "নোটিফিকেশনের অনুমতি দেওয়া হয়নি।"
      );

    }

  }


  /* Initial Load */

  renderTasks();

</script>

</body>
</html>
