<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyX - আজকের কাজ</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
    color: #1f2937;
    min-height: 100vh;
}

.header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    padding: 25px 20px 30px;
    border-radius: 0 0 28px 28px;
}

.header h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.header p {
    font-size: 15px;
    opacity: 0.9;
}

.date-box {
    margin-top: 20px;
    background: rgba(255,255,255,0.15);
    padding: 13px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
}

.date-box span {
    font-size: 14px;
}

.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.section-title h2 {
    font-size: 20px;
}

.count {
    background: #e0e7ff;
    color: #4338ca;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 13px;
}

.task {
    background: white;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 13px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.check {
    width: 25px;
    height: 25px;
    border: 2px solid #2563eb;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
}

.task-info {
    flex: 1;
}

.task-info h3 {
    font-size: 16px;
    margin-bottom: 5px;
}

.task-info p {
    font-size: 13px;
    color: #6b7280;
}

.delete {
    border: none;
    background: #fee2e2;
    color: #dc2626;
    width: 35px;
    height: 35px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.completed .check {
    background: #22c55e;
    border-color: #22c55e;
    position: relative;
}

.completed .check::after {
    content: "✓";
    color: white;
    position: absolute;
    left: 5px;
    top: 1px;
    font-weight: bold;
}

.completed h3 {
    text-decoration: line-through;
    color: #9ca3af;
}

.empty {
    text-align: center;
    background: white;
    padding: 35px 20px;
    border-radius: 20px;
    color: #6b7280;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

.add-btn {
    position: fixed;
    right: 22px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    font-size: 30px;
    box-shadow: 0 7px 20px rgba(37,99,235,0.35);
    cursor: pointer;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 420px;
    border-radius: 22px;
    padding: 23px;
}

.modal-box h2 {
    margin-bottom: 18px;
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

.save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 13px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 5px;
}

.cancel-btn {
    width: 100%;
    padding: 13px;
    border: none;
    background: #f3f4f6;
    border-radius: 13px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<header class="header">
    <h1 id="greeting">শুভ সকাল 👋</h1>
    <p>আপনার দিনের কাজগুলো মনে রাখতে সাহায্য করবে DailyX</p>

    <div class="date-box">
        <span id="todayDate">আজকের তারিখ</span>
    </div>
</header>

<main class="container">

    <div class="section-title">
        <h2>আজকের কাজ</h2>
        <span class="count" id="taskCount">0 টি</span>
    </div>

    <div id="taskList"></div>

</main>

<button class="add-btn" onclick="openModal()">+</button>

<!-- Add Task Modal -->
<div class="modal" id="modal">

    <div class="modal-box">

        <h2>নতুন কাজ যোগ করুন</h2>

        <div class="input-group">
            <label>কাজের নাম</label>
            <input type="text" id="taskName" placeholder="কাজের নাম লিখুন">
        </div>

        <div class="input-group">
            <label>তারিখ</label>
            <input type="date" id="taskDate">
        </div>

        <div class="input-group">
            <label>সময়</label>
            <input type="time" id="taskTime">
        </div>

        <button class="save-btn" onclick="addTask()">
            কাজ যোগ করুন
        </button>

        <button class="cancel-btn" onclick="closeModal()">
            বাতিল
        </button>

    </div>
</div>

<script>

let tasks = JSON.parse(localStorage.getItem("dailyx_tasks")) || [];

const today = new Date();

function getToday() {
    return today.toISOString().split("T")[0];
}

function showDate() {

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("todayDate").innerText =
        today.toLocaleDateString("bn-BD", options);
}

function showGreeting() {

    const hour = new Date().getHours();

    let greeting;

    if (hour < 12) {
        greeting = "শুভ সকাল 👋";
    } else if (hour < 17) {
        greeting = "শুভ দুপুর 👋";
    } else {
        greeting = "শুভ সন্ধ্যা 👋";
    }

    document.getElementById("greeting").innerText = greeting;
}

function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    const todayTasks = tasks.filter(task => task.date === getToday());

    document.getElementById("taskCount").innerText =
        todayTasks.length + " টি";

    if (todayTasks.length === 0) {

        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📋</div>
                <h3>আজ কোনো কাজ নেই</h3>
                <p>নতুন কাজ যোগ করতে নিচের + বাটনে চাপ দিন</p>
            </div>
        `;

        return;
    }

    todayTasks.forEach(task => {

        const div = document.createElement("div");

        div.className = "task " + (task.completed ? "completed" : "");

        div.innerHTML = `
            <div class="check" onclick="completeTask(${task.id})"></div>

            <div class="task-info">
                <h3>${task.name}</h3>
                <p>🕐 ${task.time}</p>
            </div>

            <button class="delete"
                onclick="deleteTask(${task.id})">
                🗑
            </button>
        `;

        list.appendChild(div);
    });
}

function openModal() {

    document.getElementById("modal").style.display = "flex";

    document.getElementById("taskDate").value = getToday();
}

function closeModal() {

    document.getElementById("modal").style.display = "none";

    document.getElementById("taskName").value = "";
    document.getElementById("taskTime").value = "";
}

function addTask() {

    const name = document.getElementById("taskName").value.trim();
    const date = document.getElementById("taskDate").value;
    const time = document.getElementById("taskTime").value;

    if (!name) {
        alert("দয়া করে কাজের নাম লিখুন");
        return;
    }

    if (!date) {
        alert("দয়া করে তারিখ নির্বাচন করুন");
        return;
    }

    if (!time) {
        alert("দয়া করে সময় নির্বাচন করুন");
        return;
    }

    const task = {

        id: Date.now(),

        name: name,

        date: date,

        time: time,

        completed: false

    };

    tasks.push(task);

    localStorage.setItem(
        "dailyx_tasks",
        JSON.stringify(tasks)
    );

    closeModal();

    renderTasks();
}

function completeTask(id) {

    tasks = tasks.map(task => {

        if (task.id === id) {
            task.completed = !task.completed;
        }

        return task;

    });

    localStorage.setItem(
        "dailyx_tasks",
        JSON.stringify(tasks)
    );

    renderTasks();
}

function deleteTask(id) {

    if (!confirm("এই কাজটি মুছে ফেলতে চান?")) {
        return;
    }

    tasks = tasks.filter(task => task.id !== id);

    localStorage.setItem(
        "dailyx_tasks",
        JSON.stringify(tasks)
    );

    renderTasks();
}

showDate();
showGreeting();
renderTasks();

</script>

</body>
</html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
</head>
