<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fc">

<title>DailyX</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7fc;
  color:#172033;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:28px 20px 90px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.greeting{
  color:#7b8494;
  font-size:16px;
  margin-bottom:7px;
}

.logo-title{
  font-size:45px;
  font-weight:700;
  letter-spacing:-2px;
}

.date{
  color:#7b8494;
  font-size:17px;
  margin-top:15px;
}

.dx-logo{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#29479c;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
}

/* BUDGET */

.budget{
  margin-top:32px;
  background:linear-gradient(135deg,#2948a3,#5368db);
  color:white;
  border-radius:32px;
  padding:30px 26px;
  box-shadow:0 18px 35px rgba(53,76,180,.22);
}

.budget-label{
  font-size:18px;
  opacity:.9;
}

.total{
  font-size:43px;
  font-weight:bold;
  margin:10px 0 25px;
}

.budget-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.budget-box{
  background:rgba(255,255,255,.15);
  border-radius:20px;
  padding:17px;
}

.budget-box span{
  display:block;
  font-size:16px;
  opacity:.9;
}

.budget-box strong{
  display:block;
  font-size:24px;
  margin-top:8px;
}

/* QUICK TOOLS */

.section{
  margin-top:35px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-title h2{
  font-size:25px;
}

.section-title a{
  color:#29479c;
  font-size:15px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.tool{
  background:white;
  border-radius:22px;
  padding:18px 7px;
  text-align:center;
  box-shadow:0 7px 20px rgba(20,30,60,.06);
  cursor:pointer;
}

.tool-icon{
  font-size:31px;
  margin-bottom:10px;
}

.tool-name{
  font-size:14px;
}

/* TASKS */

.task{
  background:white;
  border-radius:23px;
  padding:20px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 7px 20px rgba(20,30,60,.05);
}

.checkbox{
  width:37px;
  height:37px;
  border:3px solid #c6cedc;
  border-radius:11px;
  background:white;
  flex-shrink:0;
  cursor:pointer;
}

.task-content{
  flex:1;
}

.task-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:7px;
}

.task-meta{
  color:#9098a6;
  font-size:14px;
}

.completed .task-title{
  text-decoration:line-through;
  color:#9ca3af;
}

.completed .checkbox{
  background:#29479c;
  border-color:#29479c;
  position:relative;
}
